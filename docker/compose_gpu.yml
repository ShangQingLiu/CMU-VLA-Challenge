services:
  ubuntu20_ros_system:
    runtime: nvidia
    build:
      context: .
      dockerfile: Dockerfile_system
    container_name: ubuntu20_ros_system
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /home/${USER}/CMU-VLA-Challenge

    # 等效于 --gpus all（比 runtime: nvidia 更推荐）
    gpus: all

    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb:rw
      # - /homeL/${USER}/dataSSD/TAMSxGalbot:/home/${USER}:rw
      - /home/${USER}:/home/${USER}:rw

  ubuntu20_ros:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubuntu20_ros
    network_mode: host
    privileged: true
    user: "root"          # 等效于 `-u root`
    stdin_open: true
    tty: true
    working_dir: /home/${USER}/CMU-VLA-Challenge

    # 等效于 `--gpus all`
    gpus: all

    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DISABLE_ROS1_EOL_WARNINGS=1
      # 可选：更兼容的 GPU 环境变量（保留/删除均可）
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video,graphics

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb:rw
      # - /homeL/${USER}/dataSSD/TAMSxGalbot:/home/${USER}:rw
      - /home/${USER}:/home/${USER}:rw
